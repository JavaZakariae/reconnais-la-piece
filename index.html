<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reconnais la Pièce</title>
<meta name="description" content="Quiz pour reconnaître 177 pièces de plomberie, chauffage et débouchage, avec photos, noms français et néerlandais, et 3 niveaux.">
<meta name="theme-color" content="#1C2630">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout : fiche de catalogue grossiste — dessin technique sur papier millimétré, réponses en dessous, une colonne de 760px */
:root{
  --bg:#E9ECEE; --paper:#FBFCFC; --ink:#1C2630; --muted:#56646F; --line:#CCD3D8; --grid:#E1E6EA;
  --copper:#B4602B; --brass:#CDA444; --steel:#BAC3CA; --pvc:#98A5AE; --signal:#C9392E; --rubber:#6E2A22; --wood:#A97A4A; --soil:#DCD5C7; --water:#8FB4CC;
  --blue:#2F6FB0; --yellow:#E0B229; --ok:#25703F; --ok-bg:#E1F1E6; --bad:#A92820; --bad-bg:#F8E3E1;
  --photo:#FFFFFF;
  --f-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111619; --paper:#1A2127; --ink:#E2E7EB; --muted:#97A4AE; --line:#303B44; --grid:#212A31;
    --copper:#D7854F; --brass:#D6B456; --steel:#5E6C77; --pvc:#556470; --signal:#DD5649; --rubber:#9C463B; --wood:#B98C5C; --soil:#39342C; --water:#3E6680;
    --blue:#5B95D6; --yellow:#E8C24C; --ok:#6BC891; --ok-bg:#16301F; --bad:#F2786F; --bad-bg:#3A1C1A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111619; --paper:#1A2127; --ink:#E2E7EB; --muted:#97A4AE; --line:#303B44; --grid:#212A31;
  --copper:#D7854F; --brass:#D6B456; --steel:#5E6C77; --pvc:#556470; --signal:#DD5649; --rubber:#9C463B; --wood:#B98C5C; --soil:#39342C; --water:#3E6680;
  --blue:#5B95D6; --yellow:#E8C24C; --ok:#6BC891; --ok-bg:#16301F; --bad:#F2786F; --bad-bg:#3A1C1A;
  color-scheme:dark;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:28px 56px;display:flex;flex-direction:column;gap:20px}
.mono{font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 24px}
header .titles{display:flex;flex-direction:column;gap:4px;min-width:0}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(2.3rem,7vw,3.4rem);line-height:.95;text-transform:uppercase;letter-spacing:.01em;margin:0;text-wrap:balance}
h1 span{color:var(--copper)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--paper);gap:2px}
.seg button{font:500 13px var(--f-body);color:var(--muted);background:none;border:0;border-radius:999px;padding:6px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button:focus-visible,.opt:focus-visible,.btn:focus-visible,.chipbtn:focus-visible{outline:2px solid var(--copper);outline-offset:2px}

.settings{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center}
.settings label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}

.card{background:var(--paper);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ticks{display:flex;gap:4px;flex:1;min-width:120px;max-width:260px}
.ticks i{flex:1;height:6px;border-radius:2px;background:var(--line)}
.ticks i.ok{background:var(--ok)} .ticks i.bad{background:var(--bad)} .ticks i.now{background:var(--ink)}

.plate{position:relative;background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:20px 20px;background-position:-1px -1px;display:flex;justify-content:center;padding-block:18px}
.plate svg{width:min(100%,400px);height:auto;max-width:100%;display:block}
.plate .ref{position:absolute;left:14px;bottom:10px;color:var(--muted)}

.body{padding:18px 18px 20px;display:flex;flex-direction:column;gap:14px}
.q{font-family:var(--f-display);font-weight:600;font-size:1.5rem;text-transform:uppercase;letter-spacing:.02em;margin:0}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:480px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:10px;text-align:left;font:500 15px var(--f-body);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:11px 12px;cursor:pointer;min-width:0}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .key{font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:1px 6px;flex:none}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.correct .key{border-color:var(--ok);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .key{border-color:var(--bad);color:var(--bad)}
.opt.dim{opacity:.55}

.fb{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.verdict{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin:0;font-weight:500}
.fb.is-ok .verdict{color:var(--ok)} .fb.is-bad .verdict{color:var(--bad)}
.fb h3{font-family:var(--f-display);font-weight:700;font-size:1.7rem;text-transform:uppercase;margin:0;line-height:1.05}
.nl{font-family:var(--f-body);font-weight:400;font-size:.95rem;text-transform:none;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;border:1px solid var(--line);border-radius:3px;padding:2px 7px;color:var(--muted)}
.fb p{margin:0;max-width:62ch}
.conf{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--muted);background:var(--bg);border-radius:4px;padding:6px 10px}
.conf svg{width:56px;height:auto;flex:none}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font:600 14px var(--f-body);border-radius:5px;padding:10px 18px;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--paper)}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.hint{color:var(--muted)}

.end{padding:22px 18px;display:flex;flex-direction:column;gap:16px}
.big{font-family:var(--f-display);font-weight:700;font-size:clamp(3.5rem,14vw,5.5rem);line-height:.9;margin:0;font-variant-numeric:tabular-nums}
.big small{font-size:.45em;color:var(--muted)}
.missed{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.missed li{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:5px;padding:8px 10px;background:var(--paper)}
.missed svg{width:72px;height:auto;flex:none}
.missed div{min-width:0}
.missed strong{display:block}
.missed span{font-size:13px;color:var(--muted)}

.filters{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{font:500 13px var(--f-body);color:var(--muted);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}
.chipbtn[aria-pressed="true"]{color:var(--paper);background:var(--ink);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
.tile .plate{padding-block:10px}
.tile .plate svg{width:100%}
.tile .txt{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile h3{font-family:var(--f-display);font-weight:700;font-size:1.3rem;text-transform:uppercase;margin:0;line-height:1.05}
.tile p{margin:0;font-size:13.5px;color:var(--muted)}
footer{color:var(--muted);font-size:12.5px}

.plate.photo{background:var(--photo);background-image:none;padding:14px;align-items:center}
.plate.photo img{display:block;width:100%;height:clamp(220px,52vw,340px);object-fit:contain;cursor:zoom-in}
.tile .plate.photo{padding:10px}
.tile .plate.photo img{height:200px}
.plate.photo > button{position:absolute;right:8px;top:8px;font:600 11px var(--f-body);border:0;border-radius:3px;background:#1C2630;color:#fff;padding:2px 7px;cursor:pointer}
.plate.photo > button.confirm{background:var(--bad)}
.plate .tag{position:absolute;right:12px;top:10px;background:var(--paper);color:var(--ink);border-radius:3px;padding:2px 7px;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.plate.photo .ref{color:#56646F}
.plate.photo .tag{background:#1C2630;color:#FBFCFC}
.compare{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.compare svg,.compare img{width:120px;height:90px;border:1px solid var(--line);border-radius:4px;background:var(--paper);object-fit:contain}
.compare img{background:var(--photo);cursor:zoom-in}
img.pimg{display:block;object-fit:contain;background:var(--photo);border-radius:4px}
.missed img.pimg{width:72px;height:56px;flex:none}
.conf img.pimg{width:56px;height:44px;flex:none}
.plate img.pimg{width:100%;height:clamp(220px,52vw,340px)}
.lvl{font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;border-radius:3px;padding:2px 7px;color:#fff;white-space:nowrap}
.lvl.l1{background:#25703F}.lvl.l2{background:#2F6FB0}.lvl.l3{background:#B4602B}
.zoom{position:fixed;inset:0;z-index:50;background:rgba(10,14,18,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;cursor:zoom-out}
.zoom img{width:min(100%,720px);max-height:80vh;object-fit:contain;background:#fff;border-radius:6px}
.zoom p{color:#fff;margin:0;font-family:var(--f-display);font-size:1.4rem;text-transform:uppercase;text-align:center}
.note{background:var(--paper);border:1px dashed var(--line);border-radius:6px;padding:12px 14px;font-size:13.5px;color:var(--muted);max-width:none}
.note strong{color:var(--ink)}
.ph{display:flex;flex-direction:column;gap:8px;padding:10px 14px 0}
.thumbs{display:flex;flex-wrap:wrap;gap:6px}
.thumb{position:relative;width:84px;height:64px;border-radius:4px;overflow:hidden;border:1px solid var(--line);background:var(--photo)}
.thumb img{width:100%;height:100%;object-fit:contain;display:block;cursor:zoom-in}
.thumb svg{width:100%;height:100%;display:block;background:var(--paper)}
.thumb button{position:absolute;right:2px;top:2px;font:600 11px var(--f-body);border:0;border-radius:3px;background:var(--paper);color:var(--ink);padding:1px 5px;cursor:pointer;opacity:.9}
.thumb button.confirm{background:var(--bad);color:var(--paper);left:2px}
.addph{align-self:flex-start;font:500 13px var(--f-body);color:var(--ink);background:none;border:1px dashed var(--muted);border-radius:4px;padding:6px 10px;cursor:pointer}
.addph:disabled{opacity:.6;cursor:progress}
.err{color:var(--bad);font-size:12.5px;margin:0}
.gimg{font:500 13.5px var(--f-body);color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--copper);align-self:flex-start}
.gimg:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
.sel{font:500 13px var(--f-body);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 12px;max-width:100%}
.sel:focus-visible,.search:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
.search{font:400 15px var(--f-body);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:10px 12px;width:100%}
.famhead{display:flex;align-items:baseline;gap:10px;margin:8px 0 0;font-family:var(--f-display);font-weight:700;font-size:1.5rem;text-transform:uppercase}
.famhead span{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:400}
.imp{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.imp .btn{padding:8px 14px;font-size:13px}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:var(--copper)}
.hunt-head{display:flex;flex-direction:column;gap:10px}
.hunt-bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.hunt-bar i{display:block;height:100%;background:var(--ok)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--muted)}
.steps strong{color:var(--ink)}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.row.done{border-color:var(--ok)}
.row.target{outline:2px dashed var(--copper);outline-offset:2px}
.row.drag{background:var(--bg)}
.row .mini{width:96px;height:68px;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:12px 12px;border-radius:4px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.row .mini svg{width:100%;height:auto}.row .mini img{width:100%;height:100%;object-fit:contain;background:var(--photo)}
.row .info{display:flex;flex-direction:column;gap:6px;min-width:0}
.row .name{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.row .name strong{font-family:var(--f-display);font-size:1.2rem;text-transform:uppercase;line-height:1.1}
.row .acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row .acts a,.row .acts button{font:500 13px var(--f-body);border-radius:4px;padding:6px 10px;cursor:pointer;text-decoration:none;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.row .acts .go{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.row .acts .ok{color:var(--ok);border-color:var(--ok);font-family:var(--f-mono);font-size:12px}
.row .acts a:focus-visible,.row .acts button:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
@media (max-width:480px){.row{grid-template-columns:72px minmax(0,1fr)}.row .mini{width:72px;height:52px}}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* dessins */
.part .k{stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.part .cu{fill:var(--copper)} .part .br{fill:var(--brass)} .part .st{fill:var(--steel)} .part .pv{fill:var(--pvc)}
.part .pa{fill:var(--paper)} .part .sg{fill:var(--signal)} .part .rb{fill:var(--rubber)} .part .wd{fill:var(--wood)}
.part .ink{fill:var(--ink)} .part .bl{fill:var(--blue)} .part .yl{fill:var(--yellow)}
.part .thin{stroke-width:1} .part .txt{fill:var(--ink);font-family:var(--f-mono)} .part .txtl{fill:var(--paper);font-family:var(--f-mono)} .part .soil{fill:var(--soil)} .part .water{fill:var(--water)} .part .no{fill:none}
.part .dash{stroke-dasharray:4 4}
.part .hl{fill:none;stroke:var(--paper);stroke-width:3;opacity:.4;stroke-linecap:round}
@media (prefers-reduced-motion:no-preference){
  .plate svg.anim{animation:in .25s ease-out}
  @keyframes in{from{opacity:.4;transform:scale(.97)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="titles">
      <span class="eyebrow">Sanitaire · chauffage · débouchage</span>
      <h1>Reconnais <span>la pièce</span></h1>
    </div>
    <div class="seg" role="group" aria-label="Affichage">
      <button type="button" id="tab-quiz" data-view="quiz">Quiz</button>
      <button type="button" id="tab-cat" data-view="cat">Catalogue</button>
      <button type="button" id="tab-photos" data-view="photos">Photos</button>
    </div>
  </header>
  <main id="app"></main>
  <footer><span id="count">94</span> pièces · noms en français et en néerlandais · 3 niveaux (Année 1, 2, 3) · touche une photo pour l’agrandir · touches 1 à 4 pour répondre, Entrée pour continuer.</footer>
</div>
<input type="file" id="photo-input" accept="image/*" class="vh" tabindex="-1" aria-hidden="true">
<input type="file" id="bulk-input" accept="image/jpeg,image/png,image/webp" multiple class="vh" tabindex="-1" aria-hidden="true">
<input type="file" id="folder-input" webkitdirectory multiple class="vh" tabindex="-1" aria-hidden="true">

<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
const slots = Array.from({length:6},(_,i)=>`<rect class="ink" opacity=".75" x="58" y="${30+i*15}" width="84" height="6" rx="3"/>`).join('');

const FAMS = {raccord:'Raccords & tubes', evac:'Évacuation', robinet:'Robinetterie', sanit:'Sanitaire', chauffage:'Chauffage', outil:'Outils', etanch:'Étanchéité & fixation'};

const PARTS = [
 {id:'coude', fr:'Coude 90°', nl:'Bocht 90°', fam:'raccord', spec:'Cuivre · Ø 15 mm', conf:'te',
  info:"Change la direction d'une conduite à angle droit. Sur le cuivre, il se brase ou se soude. Il existe aussi à 45° pour limiter les pertes de charge.",
  svg:`<path class="cu k" d="M30 50 H90 A40 40 0 0 1 130 90 V120 H100 V90 A10 10 0 0 0 90 80 H30 Z"/><path class="hl" d="M42 58 H88 A32 32 0 0 1 122 90 V108"/><rect class="cu k" x="24" y="45" width="14" height="40" rx="2"/><rect class="cu k" x="95" y="114" width="40" height="14" rx="2"/>`},
 {id:'te', fr:'Té', nl:'T-stuk', fam:'raccord', spec:'Cuivre · Ø 22 mm', conf:'coude',
  info:"Crée une dérivation : une arrivée et deux sorties. On l'utilise pour piquer une nouvelle alimentation sur une conduite existante.",
  svg:`<path class="cu k" d="M20 45 H180 V75 H115 V125 H85 V75 H20 Z"/><path class="hl" d="M30 53 H170"/><rect class="cu k" x="14" y="41" width="14" height="38" rx="2"/><rect class="cu k" x="172" y="41" width="14" height="38" rx="2"/><rect class="cu k" x="81" y="115" width="38" height="14" rx="2"/>`},
 {id:'manchon', fr:'Manchon', nl:'Mof', fam:'raccord', spec:'Cuivre · Ø 15 mm', conf:'sertir',
  info:"Relie deux tubes du même diamètre en ligne droite. Classique pour réparer une fuite après avoir coupé le morceau abîmé.",
  svg:`<rect class="cu k" x="8" y="57" width="62" height="26"/><rect class="cu k" x="130" y="57" width="62" height="26"/><rect class="cu k" x="58" y="49" width="84" height="42" rx="3"/><path class="hl" d="M66 57 H134"/><line class="k dash" x1="100" y1="49" x2="100" y2="91"/>`},
 {id:'reduction', fr:'Réduction', nl:'Verloopstuk', fam:'raccord', spec:'Cuivre · Ø 22 → 15 mm', conf:'manchon',
  info:"Raccorde deux tubes de diamètres différents, par exemple du 22 mm vers du 15 mm, quand on passe d'une conduite principale à une alimentation d'appareil.",
  svg:`<path class="cu k" d="M25 38 H85 L115 56 H175 V84 H115 L85 102 H25 Z"/><line class="k" x1="85" y1="38" x2="85" y2="102"/><line class="k" x1="115" y1="56" x2="115" y2="84"/><path class="hl" d="M33 47 H80 M122 63 H168"/>`},

/* ---------- aides de dessin ---------- */
const R=(x,y,w,h,c='',rx=0)=>`<rect class="${c} k" x="${x}" y="${y}" width="${w}" height="${h}"${rx?` rx="${rx}"`:''}/>`;
const C=(x,y,r,c='')=>`<circle class="${c} k" cx="${x}" cy="${y}" r="${r}"/>`;
const E=(x,y,rx,ry,c='')=>`<ellipse class="${c} k" cx="${x}" cy="${y}" rx="${rx}" ry="${ry}"/>`;
const P=(d,c='no')=>`<path class="${c} k" d="${d}"/>`;
const L=(x1,y1,x2,y2,c='')=>`<line class="k ${c}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
const G=(pts,c='')=>`<polygon class="${c} k" points="${pts}"/>`;
const HL=d=>`<path class="hl" d="${d}"/>`;
const ST=(d,col,w,extra='')=>`<path d="${d}" style="fill:none;stroke:var(--${col});stroke-width:${w}${extra}"/>`;
const RING=(x,y,r,col,w)=>`<circle cx="${x}" cy="${y}" r="${r}" style="fill:none;stroke:var(--${col});stroke-width:${w}"/>`;
const TX=(x,y,s,t,c='txt')=>`<text class="${c}" x="${x}" y="${y}" font-size="${s}" text-anchor="middle">${t}</text>`;
const THR=(x,y,w,h)=>{let s='';for(let i=3;i<w-2;i+=5)s+=`<line class="k thin" x1="${x+i}" y1="${y}" x2="${x+i+3}" y2="${y+h}"/>`;return s;};
const NUT=(x,y,w,h,c='br')=>G(`${x},${y+4} ${x+4},${y} ${x+w-4},${y} ${x+w},${y+4} ${x+w},${y+h-4} ${x+w-4},${y+h} ${x+4},${y+h} ${x},${y+h-4}`,c)+L(x,y+h*.3,x+w,y+h*.3,'thin')+L(x,y+h*.7,x+w,y+h*.7,'thin');
const RIBS=(x1,x2,y1,y2,step=6)=>{let s='';for(let x=x1;x<=x2;x+=step)s+=L(x,y1,x,y2,'thin');return s;};
const RIBSH=(y1,y2,x1,x2,step=6)=>{let s='';for(let y=y1;y<=y2;y+=step)s+=L(x1,y,x2,y,'thin');return s;};

const QUERY = {coude:'coude cuivre 90° à souder', te:'té égal cuivre à souder', manchon:'manchon cuivre à souder', reduction:'réduction cuivre à souder 22 15', compression:'raccord à compression laiton olive', sertir:'raccord à sertir cuivre Viega Profipress', flexible:'flexible inox tressé sanitaire', vanne:'vanne quart de tour laiton 1/2', clapet:'clapet anti-retour laiton', reducteur:'réducteur de pression eau manomètre', thermo:'robinet thermostatique radiateur équerre', sterput:'sterput avaloir de sol grille', regard:'chambre de visite égout', siphon:'siphon bouteille lavabo', furet:'furet déboucheur canalisation', ventouse:'ventouse débouchage WC', coupetube:'coupe tube cuivre', purge:'clé de purge radiateur'};
function gImg(p){return 'https://www.google.com/search?tbm=isch&q='+encodeURIComponent(p.q||QUERY[p.id]||p.fr)}
function gLink(p){return `<a class="gimg" href="${gImg(p)}" target="_blank" rel="noopener">Voir des photos réelles ↗</a>`}
const OK_WORDS = ['Exact','Bien vu','C’est ça','Correct'];

function svg(p, cls='', label='Pièce à identifier'){
  if(!p.svg){
    const ph = photosOf(p.id)[0];
    return ph ? `<img class="pimg ${cls}" src="${src(ph)}" alt="${label}" loading="lazy" data-zoom="${p.id}">`
              : `<svg viewBox="0 0 200 140" class="part ${cls}" role="img" aria-label="${label}">${TX(100,80,28,'?')}</svg>`;
  }
  return `<svg viewBox="0 0 200 140" class="part ${cls}" role="img" aria-label="${label}">${p.svg}</svg>`;
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pad(n){return String(n).padStart(2,'0')}
function store(k,v){try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){return null}}

let S;
let DB = null, ASSETS = null, capState = 'loading', dbBroken = false;
let PHOTOS = {};            // id de pièce -> [{doc, asset, at}]
const busy = {}, errs = {};
let confirmDel = null, pendingPart = null, capsStarted = false;
let pasteTarget = null, huntFilter = 'missing', huntFam = 'all';
const IMP = {running:false, finished:false, total:0, done:0, added:0, skipped:0, failed:0, unknown:[], stopMsg:''};
let renderTimer = null;
function renderSoon(){ if(renderTimer) return; renderTimer = setTimeout(()=>{ renderTimer=null; render(); }, IMP.running ? 1500 : 60); }

function freshState(prev){
  const settings = Object.assign({lang:'fr', level:'apprenti', img:'mix', fam:'all', len:10, niv:'all'}, prev?.settings || {});
  return {view: prev?.view || 'quiz', settings, filter: prev?.filter || 'all', deck: makeDeck(settings), idx:0, score:0, streak:0, answers:[], done:false};
}
function makeDeck(st){
  const level = st.level;
  const src = PARTS.filter(p=>(st.fam==='all' || p.fam===st.fam) && (st.niv==='all' || !st.niv || p.lvl<=Number(st.niv)) && !(st.img==='dessin' && !p.svg));
  return shuffle(src).slice(0, Number(st.len)||ROUND).map(p=>{
    let pool = PARTS.filter(x=>x.id!==p.id);
    let picks;
    if(level==='pro' || st.fam!=='all'){
      const same = shuffle(pool.filter(x=>x.fam===p.fam));
      const conf = p.conf && byId[p.conf] ? [byId[p.conf]] : [];
      picks = [...new Set([...conf, ...same, ...shuffle(pool)])].slice(0,3);
    } else picks = shuffle(pool).slice(0,3);
    return {id:p.id, opts: shuffle([p.id, ...picks.map(x=>x.id)]), r:Math.random(), r2:Math.random()};
  });
}
function name(p){return S.settings.lang==='nl' ? p.nl : p.fr}
function photosOf(id){const p=byId[id]; const own=PHOTOS[id]||[]; return p && p.local ? [{asset:p.id, url:p.local, builtin:true, name:'catalogue', doc:''}, ...own] : own}
function photoCount(){return Object.values(PHOTOS).reduce((n,a)=>n+a.length,0)}
function src(ph){return ph.url || ('/_blob/' + ph.asset)}
function questionPhoto(q){
  const ph = photosOf(q.id), mode = S.settings.img;
  if(!ph.length) return null;
  if(!byId[q.id].svg) return ph[Math.floor((q.r ?? 0)*ph.length) % ph.length];
  if(mode==='dessin') return null;
  if(mode==='mix' && (q.r2 ?? 0) >= 0.6) return null;
  return ph[Math.floor((q.r ?? 0)*ph.length) % ph.length];
}

const app = document.getElementById('app');

function render(){
  document.getElementById('tab-quiz').setAttribute('aria-pressed', S.view==='quiz');
  document.getElementById('tab-cat').setAttribute('aria-pressed', S.view==='cat');
  document.getElementById('tab-photos').setAttribute('aria-pressed', S.view==='photos');
  app.innerHTML = S.view==='quiz' ? (S.done ? endHTML() : quizHTML()) : S.view==='photos' ? photosHTML() : catHTML();
}

function settingsHTML(){
  const b=(group,val,label)=>`<button type="button" data-set="${group}" data-val="${val}" aria-pressed="${String(S.settings[group])===val}">${label}</button>`;
  const n = photoCount();
  return `<div class="settings">
    <label>Réponses <span class="seg" role="group" aria-label="Langue des réponses">${b('lang','fr','Français')}${b('lang','nl','Nederlands')}</span></label>
    <label>Niveau <span class="seg" role="group" aria-label="Niveau de formation">${b('niv','1','Année 1')}${b('niv','2','Années 1-2')}${b('niv','all','Tout')}</span></label>
    <label>Difficulté <span class="seg" role="group" aria-label="Difficulté des réponses">${b('level','apprenti','Facile')}${b('level','pro','Difficile')}</span></label>
    <label>Partie <span class="seg" role="group" aria-label="Pièces par partie">${b('len','10','10 pièces')}${b('len','20','20 pièces')}</span></label>
    <label for="fam-select">Famille <select class="sel" id="fam-select">${[['all','Toutes ('+PARTS.length+')'],...Object.entries(FAMS).map(([k,v])=>[k,v+' ('+PARTS.filter(p=>p.fam===k).length+')'])].map(([k,v])=>`<option value="${k}" ${S.settings.fam===k?'selected':''}>${v}</option>`).join('')}</select></label>
    ${(n || ASSETS || FACQ.length) ? `<label>Images <span class="seg" role="group" aria-label="Images">${b('img','mix','Mélange')}${b('img','photo','Photos')}${b('img','dessin','Dessins')}</span></label>
    <span class="mono hint">${PARTS.filter(p=>photosOf(p.id).length).length} pièces sur ${PARTS.length} ont une vraie photo</span>` : ''}
  </div>`;
}

function quizHTML(){
  const q = S.deck[S.idx], p = byId[q.id], a = S.answers[S.idx];
  const ph = questionPhoto(q);
  const ticks = S.deck.map((_,i)=>{const r=S.answers[i]; return `<i class="${r? (r.ok?'ok':'bad') : (i===S.idx?'now':'')}"></i>`}).join('');
  const opts = q.opts.map((id,i)=>{
    let cls='';
    if(a){ if(id===q.id) cls='correct'; else if(id===a.pick) cls='wrong'; else cls='dim'; }
    return `<button type="button" class="opt ${cls}" data-pick="${id}" ${a?'disabled':''}><span class="key">${i+1}</span><span>${name(byId[id])}</span></button>`;
  }).join('');
  let fb='';
  if(a){
    const c = p.conf ? byId[p.conf] : null;
    const last = S.idx===S.deck.length-1;
    const others = photosOf(p.id).filter(x=>!ph || x.asset!==ph.asset).slice(0,3);
    const compare = ((ph && p.svg) || others.length) ? `<div class="compare">${ph && p.svg ? svg(p,'',p.fr+' en dessin') : ''}${others.map(x=>`<img src="${src(x)}" alt="Photo : ${p.fr}" loading="lazy" data-zoom="${p.id}">`).join('')}</div>` : '';
    fb = `<div class="fb ${a.ok?'is-ok':'is-bad'}">
      <p class="verdict">${a.ok ? OK_WORDS[S.idx%OK_WORDS.length] : 'Raté, c’était'}</p>
      <h3>${p.fr} <span class="nl">· ${p.nl}</span></h3>
      <div class="meta">${lvlChip(p)}<span class="chip">${FAMS[p.fam]}</span><span class="mono">${p.spec}</span></div>
      <p>${p.info}</p>
      ${compare}
      ${c?`<div class="conf">${svg(c,'',c.fr)}<span>À ne pas confondre avec : <strong>${c.fr}</strong></span></div>`:''}
      <div class="actions"><button type="button" class="btn" id="next" data-act="next">${last?'Voir le résultat':'Pièce suivante'}</button><span class="mono hint">Entrée</span>${gLink(p)}</div>
    </div>`;
  }
  const ref = `<span class="ref mono">RÉF. ${pad(PARTS.indexOf(p)+1)}</span>`;
  const plate = ph
    ? `<div class="plate photo"><img src="${src(ph)}" alt="Photo de la pièce à identifier" data-zoom="${a ? p.id : '?'}"><span class="tag mono">Photo</span>${ref}</div>`
    : `<div class="plate">${svg(p,'anim')}${ref}</div>`;
  return `${settingsHTML()}
  <section class="card" aria-live="polite" style="margin-top:14px">
    <div class="card-top"><span class="mono">Pièce ${pad(S.idx+1)} / ${S.deck.length}</span><div class="ticks" aria-hidden="true">${ticks}</div><span class="mono">Score ${S.score} · Série ${S.streak}</span></div>
    ${plate}
    <div class="body">
      <h2 class="q">Quelle est cette pièce ?</h2>
      <div class="opts">${opts}</div>
      ${fb}
    </div>
  </section>`;
}

function endHTML(){
  const N = S.deck.length, BK = 'rlp-best-'+N;
  const best = Number(store(BK)||0);
  const missed = S.answers.map((a,i)=>({a,q:S.deck[i]})).filter(x=>!x.a.ok);
  let msg;
  if(S.score===N) msg = S.settings.level==='pro' ? 'Sans faute en difficulté Difficile. Tu connais ton catalogue.' : 'Sans faute. Passe en « Difficile » : les mauvaises réponses y ressemblent beaucoup plus.';
  else if(S.score>=8) msg = 'Très bien. Revois les pièces ratées ci-dessous.';
  else if(S.score>=5) msg = 'Pas mal. Un tour dans le catalogue et ça va rentrer.';
  else msg = 'C’est un début. Le catalogue est là pour apprendre les pièces une par une.';
  if(S.score<N && S.score>=Math.ceil(N*.8)) msg = 'Très bien. Revois les pièces ratées ci-dessous.';
  else if(S.score<Math.ceil(N*.8) && S.score>=Math.ceil(N*.5)) msg = 'Pas mal. Un tour dans le catalogue et ça va rentrer.';
  else if(S.score<Math.ceil(N*.5)) msg = 'C’est un début. Le catalogue est là pour apprendre les pièces une par une.';
  const list = missed.length ? `<div><p class="eyebrow" style="margin:0 0 8px">À revoir</p><ul class="missed">${missed.map(({a,q})=>{const p=byId[q.id];return `<li>${svg(p,'',p.fr)}<div><strong>${p.fr} · <span class="nl">${p.nl}</span></strong><span>Ta réponse : ${byId[a.pick].fr}</span></div></li>`}).join('')}</ul></div>` : '';
  return `<section class="card"><div class="end">
    <p class="eyebrow" style="margin:0">Résultat · ${S.settings.niv==='1'?'Année 1':S.settings.niv==='2'?'Années 1-2':'Années 1-3'} · ${S.settings.level==='pro'?'Difficile':'Facile'}</p>
    <p class="big">${S.score}<small> / ${N}</small></p>
    <p style="margin:0;max-width:56ch">${msg}</p>
    <p class="mono hint" style="margin:0">Meilleur score sur ${N} pièces : ${best} / ${N}${S.settings.fam!=='all'?' · '+FAMS[S.settings.fam]:''}</p>
    ${list}
    <div class="actions"><button type="button" class="btn" data-act="restart">Rejouer</button><button type="button" class="btn ghost" data-view="cat">Revoir les pièces</button></div>
  </div></section>`;
}

function noteHTML(){

  if(ASSETS && DB && !dbBroken) return `<div class="note" id="import-box">${importBoxHTML()}</div>`;
  if(DB && !dbBroken && photoCount()) return `<p class="note">Les photos sont ajoutées par la personne qui a créé ce jeu.</p>`;

}

function importBoxHTML(){
  const I = IMP;
  let status = '';
  if(I.running) status = `<p style="margin:8px 0 0"><strong>Import en cours : ${I.done} / ${I.total}</strong>${I.failed?` · ${I.failed} échec(s)`:''}</p><div class="progress"><i style="width:${I.total?Math.round(I.done/I.total*100):0}%"></i></div>`;

function tilePhotos(p){
  const list = photosOf(p.id);
  const canEdit = !!(ASSETS && DB && !dbBroken);
  const drawing = list.length && p.svg ? `<div class="thumb" title="Dessin">${svg(p,'',p.fr+' en dessin')}</div>` : '';
  const thumbs = drawing + list.slice(1).map(x=>`<div class="thumb"><img src="${src(x)}" alt="Photo : ${p.fr}" loading="lazy" data-zoom="${p.id}">${canEdit && !x.builtin ? (confirmDel===x.doc
      ? `<button type="button" class="confirm" data-del="${x.doc}" aria-label="Confirmer la suppression">Supprimer</button>`
      : `<button type="button" data-del="${x.doc}" aria-label="Supprimer cette photo">×</button>`) : ''}</div>`).join('');
  if(!list.length && !canEdit) return '';
  return `<div class="ph">
    ${thumbs ? `<div class="thumbs">${thumbs}</div>` : ''}
    ${canEdit ? `<button type="button" class="addph" data-add="${p.id}" ${busy[p.id]?'disabled':''}>${busy[p.id] ? 'Envoi…' : '+ Ajouter une photo'}</button>` : ''}
    ${errs[p.id] ? `<p class="err">${errs[p.id]}</p>` : ''}
  </div>`;
}

let catQuery = '', catLvl = 'all';
function norm(t){return String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
function tileHTML(p){const main = photosOf(p.id)[0]; const canEdit = !!(ASSETS && DB && !dbBroken);
  const delMain = main && canEdit && !main.builtin ? (confirmDel===main.doc ? `<button type="button" class="confirm" data-del="${main.doc}">Supprimer</button>` : `<button type="button" data-del="${main.doc}" aria-label="Supprimer cette photo">×</button>`) : '';
  return `<article class="tile">
    ${main ? `<div class="plate photo thumb-main"><img src="${src(main)}" alt="Photo : ${p.fr}" loading="lazy" data-zoom="${p.id}">${delMain}</div>` : `<div class="plate">${svg(p,'',p.fr)}</div>`}

    <h3>${p.fr}</h3><span class="nl">${p.nl}</span><p>${p.info}</p>${gLink(p)}</div></article>`}
function gridHTML(){
  const f = S.filter, q = norm(catQuery.trim());
  const list = PARTS.filter(p=>(f==='all'||p.fam===f) && (catLvl==='all' || p.lvl===Number(catLvl)) && (!q || norm(p.fr+' '+p.nl).includes(q)));
  if(!list.length) return `<p class="note">Aucune pièce ne correspond à « ${catQuery.replace(/[<>&"]/g,'')} ».</p>`;
  return Object.keys(FAMS).map(k=>{
    const items = list.filter(p=>p.fam===k);
    if(!items.length) return '';
    return `<h2 class="famhead">${FAMS[k]} <span>${items.length} pièce${items.length>1?'s':''}</span></h2><div class="grid">${items.map(tileHTML).join('')}</div>`;
  }).join('');
}
function catHTML(){
  const f = S.filter;
  const chips = [['all','Toutes'],...Object.entries(FAMS)].map(([k,v])=>`<button type="button" class="chipbtn" data-filter="${k}" aria-pressed="${f===k}">${v}</button>`).join('');

    <div class="filters">${chips}</div><div id="cat-grid" style="display:flex;flex-direction:column;gap:12px">${gridHTML()}</div></div>`;
}

    <div class="rows">${rows || `<p class="note">Toutes les pièces de cette famille ont déjà une photo. Bravo !</p>`}</div>

}

function answer(id){
  if(S.done || S.answers[S.idx]) return;
  const ok = id===S.deck[S.idx].id;
  S.answers[S.idx] = {pick:id, ok};
  if(ok){S.score++;S.streak++} else S.streak=0;
  render();
  document.getElementById('next')?.focus({preventScroll:true});
}
function next(){
  if(!S.answers[S.idx]) return;
  if(S.idx < S.deck.length-1){S.idx++; render(); app.querySelector('.opt')?.focus({preventScroll:true});}
  else { S.done = true; const BK='rlp-best-'+S.deck.length; const best=Number(store(BK)||0); if(S.score>best) store(BK, String(S.score)); render(); }
}

const UPLOAD_ERR = {
  too_large:'Photo trop lourde (20 Mo maximum).',
  unsupported_type:'Format non pris en charge : utilise une photo JPG ou PNG.',
  quota_or_state:'Plus de place pour de nouvelles photos dans ce jeu.',
  rate_limited:'Trop d’envois d’un coup. Réessaie dans un instant.',
  quota_exceeded:'Plus de place pour de nouvelles photos dans ce jeu.'
};
async function shrink(file){
  const url = URL.createObjectURL(file);
  try{
    const img = new Image();
    await new Promise((res,rej)=>{img.onload=res; img.onerror=rej; img.src=url;});
    const max = 1400, sc = Math.min(1, max/Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth*sc); c.height = Math.round(img.naturalHeight*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const blob = await new Promise(r=>c.toBlob(r,'image/jpeg',0.85));
    return blob || file;
  } catch(e){
    return file;
  } finally { URL.revokeObjectURL(url); }
}
async function addPhoto(part, file){
  if(!ASSETS || !DB || !byId[part]) return;
  busy[part] = true; errs[part] = ''; render();
  let id = null;
  try{
    const blob = await shrink(file);
    const r = await ASSETS.upload(blob, blob.type ? undefined : {type:'image/jpeg'});
    id = r.id;
    await DB.collection('photos').add({part, asset:id, name:String(file.name||'').slice(0,200), addedAt:new Date().toISOString()});
  } catch(e){
    errs[part] = UPLOAD_ERR[e?.code] || 'L’envoi a échoué. Réessaie.';
    if(id){ try{ await ASSETS.delete(id); }catch(_){} }
  }
  busy[part] = false; render();
}
async function deletePhoto(docId){
  let found=null, part=null;
  for(const [k,arr] of Object.entries(PHOTOS)){ const x=arr.find(y=>y.doc===docId); if(x){found=x; part=k;} }
  confirmDel = null;
  if(!found || !DB) { render(); return; }
  try{
    await DB.doc('photos/'+docId).delete();
    if(ASSETS){ try{ await ASSETS.delete(found.asset); }catch(_){} }
  } catch(e){ errs[part] = 'La suppression a échoué. Réessaie.'; render(); }
}

function partFromName(name){
  const base = String(name).split('/').pop().toLowerCase();
  if(!/\.(jpe?g|png|webp)$/.test(base) || base.startsWith('.')) return null;
  const m = base.match(/^([a-z0-9]+)/);
  return m && byId[m[1]] ? m[1] : null;
}
const sleep = ms => new Promise(r=>setTimeout(r,ms));
async function importFiles(fileList){
  if(!ASSETS || !DB || IMP.running) return;
  const files = Array.from(fileList||[]).filter(f=>/\.(jpe?g|png|webp)$/i.test(f.name) && !f.name.startsWith('.'));
  Object.assign(IMP, {running:true, finished:false, total:0, done:0, added:0, skipped:0, failed:0, unknown:[], stopMsg:''});
  const jobs = [];
  for(const f of files){
    const part = partFromName(f.name);
    if(!part){ IMP.unknown.push(f.name); continue; }
    if(photosOf(part).some(x=>x.name===f.name)){ IMP.skipped++; continue; }
    jobs.push({f, part});
  }
  IMP.total = jobs.length; refreshImportBox();
  for(const {f, part} of jobs){
    let ok = false, tries = 0, id = null;
    while(!ok && tries < 2){
      tries++;
      try{
        const blob = await shrink(f);
        const r = await ASSETS.upload(blob, blob.type ? undefined : {type:'image/jpeg'});
        id = r.id;
        await DB.collection('photos').add({part, asset:id, name:f.name.slice(0,200), addedAt:new Date().toISOString()});
        ok = true;
      } catch(e){
        if(id){ try{ await ASSETS.delete(id); }catch(_){} id = null; }
        const code = e?.code;
        if(code==='rate_limited' || code==='store_unavailable' || code==='unavailable'){ if(tries<2){ await sleep(5000); continue; } IMP.stopMsg='Trop d’envois d’affilée : relance l’import dans une minute, les photos déjà importées seront ignorées.'; }
        else if(code==='quota_or_state' || code==='quota_exceeded'){ IMP.stopMsg='Plus de place pour de nouvelles photos dans ce jeu. Garde 1 ou 2 photos par pièce.'; }
        break;
      }
    }
    IMP.done++;
    if(ok) IMP.added++; else IMP.failed++;
    refreshImportBox();
    if(IMP.stopMsg) break;
    await sleep(150);
  }
  IMP.running = false; IMP.finished = true;
  render();
}
for(const id of ['bulk-input','folder-input']){
  document.getElementById(id).addEventListener('change', e=>{
    const files = e.target.files; importFiles(files).finally(()=>{ e.target.value=''; });
  });
}

document.addEventListener('paste', e=>{
  if(S.view!=='photos' || !pasteTarget) return;
  const items = Array.from(e.clipboardData?.items || []);
  const it = items.find(i=>i.kind==='file' && /^image\//.test(i.type));
  const f = it ? it.getAsFile() : (e.clipboardData?.files?.[0] || null);
  if(!f){ errs[pasteTarget] = 'Le presse-papiers ne contient pas d’image. Copie l’image (clic droit → Copier l’image) puis recolle.'; render(); return; }
  e.preventDefault();
  const part = pasteTarget; pasteTarget = null;
  addPhoto(part, new File([f], (part+' - colle.'+(f.type.split('/')[1]||'png')), {type:f.type}));
});
document.addEventListener('dragover', e=>{ const r=e.target.closest && e.target.closest('[data-row]'); if(r && S.view==='photos'){ e.preventDefault(); r.classList.add('drag'); } });
document.addEventListener('dragleave', e=>{ const r=e.target.closest && e.target.closest('[data-row]'); if(r) r.classList.remove('drag'); });
document.addEventListener('drop', e=>{
  const r = e.target.closest && e.target.closest('[data-row]');
  if(!r || S.view!=='photos') return;
  e.preventDefault(); r.classList.remove('drag');
  const f = Array.from(e.dataTransfer?.files||[]).find(x=>/^image\//.test(x.type));
  if(f) addPhoto(r.dataset.row, f);
  else { errs[r.dataset.row] = 'Glisse un fichier image depuis le Finder. Depuis le navigateur, utilise plutôt Copier l’image puis Coller.'; render(); }
});

document.getElementById('photo-input').addEventListener('change', e=>{
  const f = e.target.files && e.target.files[0];
  const part = pendingPart; pendingPart = null; e.target.value = '';
  if(f && part) addPhoto(part, f);
});

function closeZoom(){ document.querySelector('.zoom')?.remove(); }
document.addEventListener('click', e=>{
  if(e.target.closest('.zoom')){ closeZoom(); return; }
  const z = e.target.closest('img[data-zoom]');
  if(z){
    const p = byId[z.dataset.zoom];
    const d = document.createElement('div'); d.className='zoom'; d.setAttribute('role','dialog'); d.setAttribute('aria-label','Photo agrandie');
    d.innerHTML = `<img src="${z.getAttribute('src')}" alt="${z.alt}">${p ? `<p>${p.fr} · ${p.nl}</p>` : `<p>Touche pour fermer</p>`}`;
    document.body.appendChild(d); return;
  }
  const t = e.target.closest('button'); if(!t) return;
  if(t.dataset.catlvl){ catLvl = t.dataset.catlvl; render(); return; }
  if(t.dataset.del){
    if(confirmDel===t.dataset.del) deletePhoto(t.dataset.del);
    else { confirmDel = t.dataset.del; render(); }
    return;
  }
  if(confirmDel){ confirmDel = null; }
  if(t.dataset.add){ pendingPart = t.dataset.add; document.getElementById('photo-input').click(); return; }
  if(t.dataset.paste){ pasteTarget = pasteTarget===t.dataset.paste ? null : t.dataset.paste; render(); return; }
  if(t.dataset.hunt){ huntFilter = t.dataset.hunt; render(); return; }
  if(t.dataset.huntfam){ huntFam = t.dataset.huntfam; render(); return; }
  if(t.dataset.bulk){ document.getElementById(t.dataset.bulk==='folder'?'folder-input':'bulk-input').click(); return; }
  if(t.dataset.view){ S.view=t.dataset.view; render(); window.scrollTo({top:0}); return; }
  if(t.dataset.pick){ answer(t.dataset.pick); return; }
  if(t.dataset.act==='next'){ next(); return; }
  if(t.dataset.act==='restart'){ S = freshState(S); S.view='quiz'; render(); return; }
  if(t.dataset.filter){ S.filter=t.dataset.filter; render(); return; }
  if(t.dataset.set){
    const g=t.dataset.set, v=t.dataset.val; if(String(S.settings[g])===v) return;
    S.settings[g]=v;
    if(g==='level' || g==='len' || g==='niv' || g==='img'){ S = freshState(S); }
    render(); return;
  }
});
document.addEventListener('input', e=>{
  if(e.target.id==='cat-search'){ catQuery = e.target.value; const g=document.getElementById('cat-grid'); if(g) g.innerHTML = gridHTML(); }
});
document.addEventListener('change', e=>{
  if(e.target.id==='fam-select'){ S.settings.fam = e.target.value; S = freshState(S); render(); document.getElementById('fam-select')?.focus(); }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && document.querySelector('.zoom')){ closeZoom(); return; }
  if(e.target.closest && e.target.closest('input,select,textarea')) return;
  if(S.view!=='quiz' || S.done || e.altKey || e.ctrlKey || e.metaKey) return;
  if(/^[1-4]$/.test(e.key) && !S.answers[S.idx]){ const id=S.deck[S.idx].opts[Number(e.key)-1]; if(id){e.preventDefault(); answer(id);} }
  else if(e.key==='Enter' && S.answers[S.idx] && document.activeElement?.id!=='next'){ e.preventDefault(); next(); }
});

async function startCaps(){
  if(capsStarted) return; capsStarted = true;
  if(!window.claude?.use){ const tp=document.getElementById('tab-photos'); if(tp) tp.hidden=true; }
  if(!window.claude?.use){ capState='none'; render(); return; }
  try{ DB = await window.claude.use('db'); }catch(_){ DB = null; }
  try{ ASSETS = await window.claude.use('assets'); }catch(_){ ASSETS = null; }
  capState = DB ? 'ready' : 'none';
  if(DB){
    DB.collection('photos').onSnapshot(snap=>{
      const next = {};
      snap.docs.forEach(d=>{
        const v = d.data();
        if(v && byId[v.part] && typeof v.asset==='string' && /^[A-Za-z0-9_-]{8,64}$/.test(v.asset)){
          (next[v.part] ??= []).push({doc:d.id, asset:v.asset, name:String(v.name||''), at:String(v.addedAt||'')});
        }
      });
      Object.values(next).forEach(a=>a.sort((x,y)=>x.at.localeCompare(y.at)));
      PHOTOS = next; if(IMP.running) refreshImportBox(); renderSoon();
    }, ()=>{ dbBroken = true; render(); });
  }
  render();
}

function start(data){
  const c=document.getElementById('count'); if(c) c.textContent=PARTS.length;
  const prev = data && data.state;
  if(prev && Array.isArray(prev.deck) && prev.deck.every(q=>byId[q.id])){
    S = prev; S.settings = Object.assign({lang:'fr', level:'apprenti', img:'mix', fam:'all', len:10, niv:'all'}, S.settings||{});
  } else S = freshState();
  window.claude?.hot?.snapshot?.(()=>({state:S}));
  render();
  startCaps();
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
